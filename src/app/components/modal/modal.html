<div class="overlay" (click)="historyClose()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>Histórico</h2>
    <div class="modal-content">
      @for (item of calculator.history(); track $index) {
        <p>{{ item }}</p>
      }
    </div>
    <div class="modal-flex">
      <button class="btnClose" (click)="historyClose()">Fechar</button>
      <button class="btnClear" (click)="historyClear()">Limpar</button>
    </div>
  </div>
</div>
